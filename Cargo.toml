[package]
name = "steady"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Private payroll with a public runway on Tari Ootle"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tari_template_lib = "=0.41.0"

[dev-dependencies]
tari_template_test_tooling = "=0.54.0"
tari_ootle_transaction = "=0.54.0"
tari_engine_types = "=0.54.0"
tari_ootle_common_types = "=0.54.0"
tari_crypto = "0.24"
ootle_byte_type = { version = "0.21", features = ["crypto"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The engine toolchain is heavy. Keep dev builds lean so the 8 GB box does not OOM.
[profile.dev]
debug = 0
incremental = false
codegen-units = 16

[profile.dev.package."*"]
opt-level = 0
debug = false
